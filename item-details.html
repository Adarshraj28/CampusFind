  <meta charset="UTF-8">

  <meta name="description" content="Case details, Smart Match breakdown, chain of custody and QR tag for a CampusFind report.">
  <base href="/">
  <title>Case details · CampusFind</title>
  <link rel="icon" type="image/png" sizes="201x200" href="assets/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">

  <script defer src="https://unpkg.com/lucide@latest"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script defer>
    window.CF || (window.CF = {});
    window.CF._cdnFallback = window.CF._cdnFallback || (() => {
      window.addEventListener('error', (e) => {
        if (e.target && e.target.tagName === 'SCRIPT') {
          try {
            if (e.target.src.indexOf('qrcode') !== -1 && !window.QRCode) {
              const dh = document.querySelector('[data-qr-holder]');
              if (dh) {
                dh.innerHTML = '<div class="text-sm text-muted" style="text-align:center;max-width:200px"><i data-lucide="qr-code" aria-hidden="true" style="width:44px;height:44px;margin:0 auto 8px"></i><b class="mono" style="display:block;color:var(--text)">Case QR unavailable offline</b><span style="font-size:12px;word-break:break-all">Scan staff can open the case record from the case ID instead.</span></div>';
                if (window.CF && window.CF.utils && window.CF.utils.refreshIcons) window.CF.utils.refreshIcons(dh);
              }
            }
          } catch (_) {}
        }
      }, true);
    })();
  </script>
  <script defer src="js/config.js"></script>
  <script defer src="js/utils.js"></script>
  <script defer src="js/storage.js"></script>

  <script defer src="js/app.js"></script>
