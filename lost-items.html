<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse lost item reports across campus and spot potential matches.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CampusFind">
  <meta property="og:title" content="Lost items — CampusFind">
  <meta property="og:description" content="Browse lost item reports across campus and spot potential matches.">
  <meta property="og:image" content="logo.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Lost items — CampusFind">
  <meta name="twitter:description" content="Browse lost item reports across campus and spot potential matches.">
  <meta name="twitter:image" content="logo.png">
  <title>Lost items · CampusFind</title>
  <link rel="icon" type="image/png" sizes="201x200" href="assets/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script defer src="https://unpkg.com/lucide@latest"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/utils.js"></script>
  <script defer src="js/storage.js"></script>
  <script defer src="js/seed.js"></script>
  <script defer src="js/validation.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/matching.js"></script>
  <script defer src="js/claims.js"></script>
  <script defer src="js/qr.js"></script>
  <script defer src="js/notifications.js"></script>
  <script defer src="js/reports.js"></script>
  <script defer src="js/items.js"></script>
  <script defer src="js/dashboard.js"></script>
  <script defer src="js/admin.js"></script>
  <script defer src="js/analytics.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body data-page="lost-items" data-nav="auto" data-auth="public">
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header id="site-nav"></header>

  <div class="app-layout" id="app-layout">
    <aside id="sidebar" aria-label="Sidebar"></aside>
    <div id="sidebar-overlay" aria-hidden="true"></div>
    <div class="app-main">
      <header id="topbar"></header>
      <main id="main-content" class="page" tabindex="-1">
        <div class="page-head">
          <div>
            <nav class="breadcrumb" aria-label="Breadcrumb">
              <a href="index.html">Home</a><i data-lucide="chevron-right" aria-hidden="true"></i>
              <span aria-current="page">Lost items</span>
            </nav>
            <h1>Lost items</h1>
            <p><span data-result-count>0 lost reports</span> · Think you found one? Open the case so staff can verify the owner.</p>
          </div>
          <div class="page-actions">
            <a class="btn btn-secondary" href="found-items.html"><i data-lucide="package-search" aria-hidden="true"></i> Found items</a>
            <a class="btn btn-primary" href="report-lost.html"><i data-lucide="plus" aria-hidden="true"></i> Report lost item</a>
          </div>
        </div>

        <div class="filter-bar" data-filter-form>
          <div class="search-field">
            <i data-lucide="search" aria-hidden="true"></i>
            <input class="input" type="search" name="q" placeholder="Search lost items..." aria-label="Search lost items">
          </div>
          <select class="input" name="category" aria-label="Filter by category">
            <option value="">All categories</option>
          </select>
          <select class="input" name="location" aria-label="Filter by location">
            <option value="">All locations</option>
          </select>
          <select class="input" name="status" aria-label="Filter by status">
            <option value="">All statuses</option>
          </select>
          <select class="input" name="date" aria-label="Filter by date">
            <option value="">Any date</option>
          </select>
          <select class="input" name="sort" aria-label="Sort results">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="updated">Recently updated</option>
          </select>
          <button type="button" class="btn btn-ghost btn-sm" data-reset>
            <i data-lucide="rotate-ccw" aria-hidden="true"></i> Reset
          </button>
        </div>

        <h2 class="visually-hidden">Lost item reports</h2>
        <div class="item-grid" data-item-list aria-live="polite"></div>
        <div data-empty-state></div>
        <div data-pagination></div>
      </main>
    </div>
  </div>

  <footer id="site-footer"></footer>
</body>
</html>
