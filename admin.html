<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CampusFind administration overview — campus-wide lost &amp; found statistics.">
  <base href="/">
  <title>Admin overview · CampusFind</title>
  <link rel="icon" type="image/png" sizes="201x200" href="assets/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script defer src="https://unpkg.com/lucide@latest"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script defer>
    window.CF || (window.CF = {});
    window.CF._cdnFallback = window.CF._cdnFallback || (() => {
      window.addEventListener('error', (e) => {
        if (e.target && e.target.tagName === 'SCRIPT') {
          try {
            if (e.target.src.indexOf('chart.js') !== -1 && !window.Chart) {
              const wb = document.getElementById('admin-analytics');
              if (wb) {
                const box = wb.querySelector('.chart-box');
                if (box) {
                  box.innerHTML = '<div class="chart-fallback" style="text-align:center;padding:16px;border:1px dashed var(--border-strong);border-radius:12px;color:var(--text-muted)"><i data-lucide="bar-chart-3" aria-hidden="true" style="width:28px;height:28px;display:block;margin:0 auto 10px"></i><p class="text-sm" style="margin:0">Charts are unavailable while offline. The tables below still show the same data.</p></div>';
                  if (window.CF && window.CF.utils && window.CF.utils.refreshIcons) window.CF.utils.refreshIcons(box);
                }
              }
            }
          } catch (_) {}
        }
      }, true);
    })();
  </script>
  <script defer src="js/config.js"></script>
  <script defer src="js/utils.js"></script>
  <script defer src="js/storage.js"></script>
  <script defer src="js/seed.js"></script>
  <script defer src="js/validation.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/matching.js"></script>
  <script defer src="js/claims.js"></script>
  <script defer src="js/qr.js"></script>
  <script defer src="js/notifications.js"></script>
  <script defer src="js/reports.js"></script>
  <script defer src="js/items.js"></script>
  <script defer src="js/dashboard.js"></script>
  <script defer src="js/admin.js"></script>
  <script defer src="js/analytics.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body data-page="admin" data-nav="app" data-auth="required" data-roles="admin">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="app-layout">
    <aside id="sidebar" aria-label="Sidebar"></aside>
    <div id="sidebar-overlay" aria-hidden="true"></div>
    <div class="app-main">
      <header id="topbar"></header>
      <main id="main-content" class="page" tabindex="-1"></main>
    </div>
  </div>
</body>
</html>
